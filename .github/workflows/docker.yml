name: Docker
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout GraphQL API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: devsoc-unsw/graphql-api
          path: graphql-api
          persist-credentials: false
      - name: Start local GraphQL API
        working-directory: graphql-api
        env:
          API_KEYS: ci_key
        run: docker compose up --build --detach --wait --wait-timeout 120
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
        working-directory: nss
      - name: Run scraper
        run: npm run scrape
        working-directory: nss
        env:
          HASURAGRES_URL: http://localhost:8000
          HASURAGRES_API_KEY: ci_key
      - name: Run Freerooms query tests
        run: npm run test
        working-directory: nss
        env:
          GRAPHQL_URL: http://localhost:8080/v1/graphql
      - name: Show local GraphQL API logs
        if: ${{ failure() }}
        working-directory: graphql-api
        run: docker compose logs
      - name: Stop local GraphQL API
        if: ${{ always() }}
        working-directory: graphql-api
        run: docker compose down --volumes
  build:
    name: Build image
    needs: [ test ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log into registry ${{ env.REGISTRY }}
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          platforms: linux/amd64
          file: nss.dockerfile
          tags: |
            ghcr.io/devsoc-unsw/freerooms-nss-scraper:${{ github.sha }}
            ghcr.io/devsoc-unsw/freerooms-nss-scraper:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    name: Deploy (CD)
    runs-on: ubuntu-latest
    needs: [ build ]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Dispatch deployment
        uses: devsoc-unsw/deployment-dispatch-action@main
        with:
          deployment-dispatcher-app-id: ${{ vars.DEPLOYMENT_DISPATCHER_APP_ID }}
          deployment-dispatcher-app-private-key: ${{ secrets.DEPLOYMENT_DISPATCHER_APP_PRIVATE_KEY }}
          updates: |
            ghcr.io/devsoc-unsw/freerooms-nss-scraper=${{ github.sha }}
