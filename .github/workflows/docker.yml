name: Docker

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout GraphQL API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: devsoc-unsw/graphql-api
          path: graphql-api
          persist-credentials: false

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libcurl4-openssl-dev \
            ninja-build

      - name: Configure C++ scraper
        working-directory: publish-scraper
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ scraper
        working-directory: publish-scraper
        run: cmake --build build

      - name: Run unit tests
        working-directory: publish-scraper
        run: |
          ctest \
            --test-dir build \
            -L unit \
            --output-on-failure

      - name: Start local GraphQL API
        working-directory: graphql-api
        env:
          API_KEYS: ci_key
        run: |
          docker compose up \
            --build \
            --detach \
            --wait \
            --wait-timeout 120

      - name: Set test year
        run: echo "YEAR=$(TZ=Australia/Sydney date +%Y)" >> "$GITHUB_ENV"

      - name: Run Publish scraper
        working-directory: publish-scraper
        env:
          HASURAGRES_URL: http://localhost:8000
          HASURAGRES_API_KEY: ci_key
        run: |
          unset YEAR
          ./build/publish-scraper

      - name: Run Publish scraper integration tests
        working-directory: publish-scraper
        env:
          GRAPHQL_URL: http://localhost:8080/v1/graphql
        run: |
          ctest \
            --test-dir build \
            -L integration \
            --output-on-failure

      - name: Show local GraphQL API logs
        if: ${{ failure() }}
        working-directory: graphql-api
        run: docker compose logs

      - name: Stop local GraphQL API
        if: ${{ always() }}
        working-directory: graphql-api
        run: docker compose down --volumes

  build:
    name: Build image
    needs:
      - test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Publish scraper image
        uses: docker/build-push-action@v5
        with:
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          platforms: linux/amd64
          file: publish-scraper.dockerfile
          tags: |
            ghcr.io/devsoc-unsw/publish-scraper:${{ github.sha }}
            ghcr.io/devsoc-unsw/publish-scraper:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max