name: Docker
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  test:
    name: "Test (${{ matrix.scraper }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        scraper:
          - nss
    steps:
      - uses: actions/checkout@v4
      - name: Checkout GraphQL API
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: devsoc-unsw/graphql-api
          path: graphql-api
          persist-credentials: false
      - name: Start local GraphQL API
        working-directory: graphql-api
        env:
          API_KEYS: ci_key
        run: |
          docker compose up --detach postgres
          for _ in $(seq 1 30); do
            if docker compose exec --no-TTY postgres pg_isready > /dev/null; then
              sleep 2
              if docker compose exec --no-TTY postgres pg_isready > /dev/null; then
                docker compose up --build --detach graphql-engine hasuragres
                exit 0
              fi
            fi
            sleep 1
          done

          docker compose logs postgres
          exit 1
      - name: Wait for local GraphQL API
        working-directory: graphql-api
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/docs > /dev/null \
              && curl --fail --silent --max-time 2 \
                --header "Content-Type: application/json" \
                --header "X-Hasura-Admin-Secret: hasurasecret" \
                --data '{"type":"export_metadata","args":{}}' \
                http://localhost:8080/v1/metadata > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
        working-directory: ${{ matrix.scraper }}
      - name: Run scraper
        run: npm run scrape
        working-directory: ${{ matrix.scraper }}
        env:
          HASURAGRES_URL: http://localhost:8000
          HASURAGRES_API_KEY: ci_key
      - name: Show local GraphQL API logs
        if: ${{ failure() }}
        working-directory: graphql-api
        run: docker compose logs
      - name: Stop local GraphQL API
        if: ${{ always() }}
        working-directory: graphql-api
        run: docker compose down --volumes
  build:
    name: "Build image (${{ matrix.scraper }})"
    needs: [ test ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scraper: [ nss ]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log into registry ${{ env.REGISTRY }}
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          platforms: linux/amd64
          file: ${{ matrix.scraper }}.dockerfile
          tags: |
            ghcr.io/devsoc-unsw/freerooms-${{ matrix.scraper }}-scraper:${{ github.sha }}
            ghcr.io/devsoc-unsw/freerooms-${{ matrix.scraper }}-scraper:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    name: Deploy (CD)
    runs-on: ubuntu-latest
    needs: [ build ]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Dispatch deployment
        uses: devsoc-unsw/deployment-dispatch-action@main
        with:
          deployment-dispatcher-app-id: ${{ vars.DEPLOYMENT_DISPATCHER_APP_ID }}
          deployment-dispatcher-app-private-key: ${{ secrets.DEPLOYMENT_DISPATCHER_APP_PRIVATE_KEY }}
          updates: |
            ghcr.io/devsoc-unsw/freerooms-nss-scraper=${{ github.sha }}
